name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
  push:
    branches:
      - main
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Commit fixo de agentskills/agentskills: o skills-ref não publica tags de release.
      SKILLS_REF_COMMIT: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
      # O skills-ref lê o SKILL.md com o encoding padrão do sistema; as skills são UTF-8.
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout skills-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: agentskills/agentskills
          ref: ${{ env.SKILLS_REF_COMMIT }}
          path: .skills-ref
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install skills-ref
        run: python -m pip install ./.skills-ref/skills-ref

      - name: Validate skills
        run: |
          status=0
          for dir in skills/*/; do
            skills-ref validate "$dir" || status=1
          done
          exit "$status"
